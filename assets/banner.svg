<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Alexis Uriel Castillo - Junior Java Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Dark navy background with a brighter blue center, like the profile picture -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0b3b73"/>
      <stop offset="0.55" stop-color="#061a3a"/>
      <stop offset="1" stop-color="#020b1e"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#00d4ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Circuit traces (left side). The right side reuses them mirrored. -->
    <g id="circuits" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 55 H110 L150 95 H250"/>
      <path d="M0 115 H70 L110 155 H200 V205"/>
      <path d="M0 175 H130 L170 135 H235"/>
      <path d="M0 235 H90 L130 195 H175"/>
      <path d="M60 0 V40 L90 70 H160"/>
      <g fill="#00d4ff" stroke="none">
        <circle cx="250" cy="95" r="5"/>
        <circle cx="200" cy="205" r="5"/>
        <circle cx="235" cy="135" r="5"/>
        <circle cx="175" cy="195" r="5"/>
        <circle cx="160" cy="70" r="5"/>
      </g>
    </g>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>

  <!-- Circuits -->
  <g opacity="0.55" filter="url(#glow)">
    <use href="#circuits"/>
    <use href="#circuits" transform="translate(1280,0) scale(-1,1)"/>
  </g>

  <!-- Text -->
  <text x="640" y="125" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#ffffff" filter="url(#glow)">Alexis Uriel Castillo</text>
  <text x="640" y="175" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#00d4ff">Junior Java Full Stack Developer</text>

  <!-- Waves -->
  <path d="M0 235 C220 190 420 270 640 235 C860 200 1060 270 1280 225 V300 H0 Z" fill="url(#wave2)"/>
  <path d="M0 255 C240 215 440 285 660 255 C880 225 1080 285 1280 248 V300 H0 Z" fill="url(#wave1)"/>
  <path d="M0 235 C220 190 420 270 640 235 C860 200 1060 270 1280 225" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>
</svg>
